[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afm-copilot"
version = "0.1.0"
description = "Make Gwyddion's full capability reachable without knowing it"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Matteo Lorenzoni" }]
keywords = ["AFM", "SPM", "Gwyddion", "microscopy", "image-processing"]

dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "gwyfile>=0.3",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
afm-copilot = "afm_copilot.cli:main"

[tool.setuptools]
# pygwy/ is deliberately NOT a package: those files are Python 2.7 and must
# never be imported by the Python 3 side. They are executed as subprocesses.
packages = ["afm_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
