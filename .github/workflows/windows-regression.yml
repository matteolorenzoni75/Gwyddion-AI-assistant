name: Windows AFM regression
on:
  pull_request:
    branches: [dev/image-wizard]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and all application extras
        run: python -m pip install -e ".[gui,dev,ml,mcp]"
      - name: Dependency consistency
        run: python -m pip check
      - name: Python and mocked GUI regression
        run: python -m pytest -q -ra
      - name: Clarify native engine coverage
        if: always()
        run: echo "Native PyGwy 32-bit integration requires the instrument workstation."
